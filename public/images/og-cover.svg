<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B50"/><stop offset="0.55" stop-color="#0B1866"/><stop offset="1" stop-color="#154FB3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(980 150) rotate(90) scale(520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6CED" stop-opacity="0.55"/><stop offset="1" stop-color="#1F6CED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0" cy="0" r="1" gradientTransform="translate(160 620) rotate(-90) scale(460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C89E" stop-opacity="0.35"/><stop offset="1" stop-color="#00C89E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="80" y1="360" x2="820" y2="415" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B95FF"/><stop offset="1" stop-color="#2FD3A6"/>
    </linearGradient>
    <linearGradient id="star" x1="950" y1="110" x2="1075" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3C4"/><stop offset="0.5" stop-color="#FFC72A"/><stop offset="1" stop-color="#EF7A1E"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <rect width="1200" height="630" fill="url(#halo2)"/>

  <!-- petites étoiles -->
  <circle cx="915" cy="330" r="3" fill="#fff" fill-opacity="0.7"/>
  <circle cx="1120" cy="300" r="2.5" fill="#fff" fill-opacity="0.6"/>
  <circle cx="1060" cy="430" r="2.5" fill="#fff" fill-opacity="0.5"/>
  <circle cx="980" cy="500" r="2" fill="#fff" fill-opacity="0.5"/>

  <!-- étoile 4 branches (accent DA) -->
  <path d="M1012 108 L1030 160 L1082 178 L1030 196 L1012 248 L994 196 L942 178 L994 160 Z" fill="url(#star)"/>
  <circle cx="1006" cy="170" r="9" fill="#fff" fill-opacity="0.9"/>

  <!-- marque -->
  <rect x="80" y="82" width="44" height="44" rx="12" fill="#1F6CED"/>
  <path d="M92 96h10a6 6 0 0 1 0 12H92zM92 108h11a6 6 0 0 1 0 12H92z" fill="#fff"/>
  <text x="140" y="116" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Bweb Agence</text>

  <!-- eyebrow -->
  <text x="82" y="214" font-family="system-ui,'Segoe UI',sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#FFC72A">CONSEIL · FORMATION · IA</text>

  <!-- titre -->
  <text x="80" y="330" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="74" font-weight="800" fill="#ffffff">Prenez une longueur</text>
  <text x="80" y="418" font-family="'Sora','Segoe UI',system-ui,sans-serif" font-size="74" font-weight="800" fill="#ffffff">d'avance <tspan fill="url(#accent)">grâce à l'IA.</tspan></text>

  <!-- sous-titre -->
  <text x="82" y="496" font-family="system-ui,'Segoe UI',sans-serif" font-size="26" font-weight="500" fill="#ffffff" fill-opacity="0.8">Le cabinet de conseil &amp; formation qui met l'IA au travail pour vous.</text>

  <!-- pied -->
  <text x="82" y="566" font-family="system-ui,'Segoe UI',sans-serif" font-size="25" font-weight="600" fill="#ffffff" fill-opacity="0.62">www.bwebagence.com  ·  Abidjan, Côte d'Ivoire</text>
</svg>
